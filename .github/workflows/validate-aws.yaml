name: Validate infrastructure
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: ./scripts/validate.sh --environment aws/dev
