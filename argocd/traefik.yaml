apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.0.0
    helm:
      skipCrds: true
      valuesObject:
        api:
          dashboard: false
        ingressClass:
          enabled: true
          isDefaultClass: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesIngress:
            enabled: true
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 127.0.0.1
        service:
          spec:
            type: NodePort
        ports:
          web:
            nodePort: 30080
          websecure:
            expose:
              default: false
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
